name: Release

# Releases run ONLY on version tags pushed by a maintainer. There is no
# pull_request trigger here, so a fork PR can never reach the publish job or
# the npm token.
on:
  push:
    tags:
      - 'v*'

# Default to read-only. Each job opts into exactly the scopes it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release is shippable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field — no `version:` input
      # (pnpm/action-setup@v4 errors if both are set).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify skill catalog (with security audit)
        run: node cli/dist/index.js verify --security

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Confirm tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match cli/package.json version $PKG"
            exit 1
          fi
          echo "Tag and package version match: $PKG"

  publish-npm:
    name: publish to npm (with provenance)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      # Required for npm provenance — lets npm attest the build came from this
      # workflow. No other write scope is granted.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish founderos with provenance
        # `prepack` bundles skills + rebuilds; publishConfig.provenance enables
        # the signed provenance attestation (requires id-token: write above).
        run: pnpm --filter founderos publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: create GitHub release
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only this job can write — and only to create the Release entry.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
